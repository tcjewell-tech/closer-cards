name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # matches Android Studio's bundled JBR used locally
      - uses: gradle/actions/setup-gradle@v6
      # No keystore in CI, so the release APK and Play bundle are unsigned; this still proves R8 shrinking builds.
      - run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease
